<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the app paint into the iPhone's safe areas.
         user-scalable is left ENABLED: disabling pinch-zoom is an accessibility
         regression, and the layout is built to survive it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pulse — your body, read like an instrument</title>
    <meta
      name="description"
      content="A private, offline dashboard for your Apple Health export. Recovery, strain and sleep — computed on your device, stored on your device, never uploaded."
    />

    <meta name="theme-color" content="#070A10" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS standalone behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Fonts are self-hosted (see styles/tokens.css) so the first offline launch
         renders identically to the first online one. Preloaded because the numeric
         readouts are the first thing the eye lands on. -->
    <link rel="preload" href="./fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Inlined so the background is correct before the stylesheet arrives — a white
         flash on a dark app is jarring, and worse on an OLED phone at 6am. */
      html { background: #070a10; }
      html[data-theme='light'] { background: #f4f6fb; }
      body { margin: 0; }
      .no-js { display: none; }
      html.nojs .no-js { display: block; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <main id="app"></main>

    <noscript>
      <div style="padding: 32px; color: #eceff6; font-family: system-ui, sans-serif; max-width: 40ch; margin: 0 auto">
        <h1 style="color: #5eead4">Pulse needs JavaScript</h1>
        <p>
          Pulse parses your Health export inside this browser — there is no server doing it
          for you. That requires JavaScript to be enabled.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
